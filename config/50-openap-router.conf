server.modules += (
    "mod_rewrite",
    "mod_setenv",
    "mod_expire",
)

server.follow-symlink = "enable"
url.access-deny += ( ".orig" )

# Poster assets live inside the document root so rewrite-if-not-file can test
# the real served file. Only misses enter PHP. Keep the key grammar strict so
# malformed paths never reach the fallback handler.
$HTTP["url"] =~ "^/posters/" {
    expire.mimetypes = (
        "image/jpeg" => "access plus 7 days",
        "image/webp" => "access plus 7 days",
    )
    url.rewrite-if-not-file = (
        "^/posters/(.*)$" => "/index.php/__openap_poster_fallback/$1"
    )
}

# A generated fallback is an error/cache-miss response, never a static asset.
# Override the public policy above after the internal rewrite so failures are
# not retained by a browser or intermediary.
$HTTP["url"] =~ "^/(?:index\.php/)?__openap_poster_fallback/" {
    setenv.set-response-header = (
        "Cache-Control" => "no-store, no-cache, must-revalidate, max-age=0",
        "Pragma" => "no-cache",
        "Expires" => "0"
    )
}

$HTTP["url"] =~ "^/(?!(posters|__openap_poster_fallback|dist|app|ajax|config|aptv/vod-source|iptv/vod-source|ap_ethernet_embed\.php|uplink_embed\.php|rootCA\.pem)).*" {
    url.rewrite-once = ( "^/(.*?)(\?.+)?$" => "/index.php/$1$2" )
    server.error-handler-404 = "/index.php"
}
