<svg xmlns="http://www.w3.org/2000/svg" width="360" height="84" viewBox="0 0 360 84" role="img" aria-labelledby="title desc">
  <title id="title">APtv stylized header logo</title>
  <desc id="desc">A compact teal television and wireless signal icon followed by the APtv wordmark.</desc>
  <defs>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fffb"/>
      <stop offset=".45" stop-color="#6bf2e8"/>
      <stop offset="1" stop-color="#12bdbd"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1fffd"/>
      <stop offset=".5" stop-color="#b6fff7"/>
      <stop offset="1" stop-color="#55ded7"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(5 8)" fill="none" stroke="url(#aqua)" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M5 31c12-15 28-15 40 0" stroke-width="5"/>
    <path d="M13 40c7-9 17-9 24 0" stroke-width="5"/>
    <path d="M22 49c2-3 5-3 7 0" stroke-width="5"/>
    <circle cx="25.5" cy="58" r="3.2" fill="url(#aqua)" stroke="none"/>
    <rect x="49" y="22" width="55" height="39" rx="9" stroke="#073b45" stroke-width="9"/>
    <rect x="49" y="22" width="55" height="39" rx="9" stroke-width="4"/>
    <path d="m70 4 7 8 7-8M77 12v10" stroke="#073b45" stroke-width="4"/>
    <path d="m70 4 7 8 7-8" stroke-width="3"/>
    <path d="m72 34 12 7-12 7z" fill="url(#aqua)" stroke="none"/>
  </g>
  <text x="125" y="59" fill="url(#word)" font-family="DejaVu Sans, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-3">AP<tspan fill="#4de1d8">tv</tspan></text>
</svg>
