# APtv's web API invokes only the commands explicitly allowed by
# /etc/sudoers.d/openap-iptv. Ubuntu's Lighttpd unit enables
# NoNewPrivileges=yes by default, which prevents that narrowly scoped sudo
# transition and makes provider indexing fail before contacting the provider.
[Service]
NoNewPrivileges=no
RestrictAddressFamilies=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
