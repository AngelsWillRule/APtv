# OpenAP owns the AP/uplink path through systemd-networkd and its dedicated
# wpa_supplicant service.  NetworkManager may still manage the physical
# Ethernet interface, but its startup-complete state can remain pending while
# OpenAP brings up the wireless uplink.  Wait for an active NM connection
# instead of blocking boot on the global startup barrier.
[Service]
ExecStart=
ExecStart=/usr/bin/nm-online -q -t 15
